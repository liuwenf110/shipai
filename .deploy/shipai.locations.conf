# 厂派（shipai）—— Next.js 应用，监听本机 127.0.0.1:3010，挂在 /shipai/ 子路径下
# 由 /etc/nginx/manban.conf 引入，因此 80 与 443 两个 server 块同时生效

# 带斜杠的根地址 Next 会 308 到 /shipai，这里直接把两者都交给 Node
location = /shipai {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
}

# basePath 为 /shipai，proxy_pass 不带 uri 以保留完整前缀交给 Node
location /shipai/ {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    # 离职证明材料最大 6MB，Server Action 限制了 8MB
    client_max_body_size 12m;
}
